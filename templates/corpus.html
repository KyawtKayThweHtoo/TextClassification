<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corpus Analysis & Vectorization - Research Paper Classification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top mb-4">
      <div class="container">
        <a class="navbar-brand" href="/">Research Paper Categorization</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link fw-bold text-uppercase" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link fw-bold text-uppercase" href="/workflow">Workflow</a></li>
            <li class="nav-item"><a class="nav-link fw-bold text-uppercase" href="/ml_pipeline">ML Pipeline</a></li>
            <li class="nav-item"><a class="nav-link fw-bold text-uppercase" href="/explore">Explore Dataset</a></li>
            <li class="nav-item"><a class="nav-link fw-bold text-uppercase" href="/insights">Accuracy Chart</a></li>
            <li class="nav-item"><a class="nav-link fw-bold text-uppercase active" href="/corpus">Corpus & TF-IDF</a></li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container mt-6">
        <h1 class="text-center mb-4">Corpus Analysis & Text Vectorization Methods</h1>
        
        <div class="card shadow-lg mb-4">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">
                    <i class="bi bi-collection me-2"></i> Research Field Corpus
                </h2>
                
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="fieldSelect" class="form-label fw-bold">
                            <i class="bi bi-filter-square me-2 text-primary"></i> Select Research Field
                        </label>
                        <select id="fieldSelect" class="form-select form-select-lg mb-3"></select>
                    </div>
                    <div class="col-md-6">
                        <label for="vectorMethodSelect" class="form-label fw-bold">
                            <i class="bi bi-diagram-3 me-2 text-success"></i> Select Vectorization Method
                        </label>
                        <select id="vectorMethodSelect" class="form-select form-select-lg mb-3">
                            <option value="tfidf">TF-IDF (Current)</option>
                            <option value="word2vec">Word2Vec</option>
                            <option value="bagofwords">Bag of Words</option>
                            <option value="count">Count Vectorizer</option>
                        </select>
                    </div>
                </div>
                
                <!-- Vectorization Method Comparison -->
                <div class="card shadow-sm mb-4" id="vectorMethodComparison" style="display: none;">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="bi bi-bar-chart me-2"></i> Vectorization Method Comparison
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-8">
                                <canvas id="methodComparisonChart" height="300"></canvas>
                            </div>
                            <div class="col-md-4">
                                <h6>Method Details</h6>
                                <div id="methodDetails">
                                    <!-- Method details will be populated here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card shadow-sm">
                    <div class="card-body p-0">
                        <div id="corpusTable" class="table-responsive w-100"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Fetch corpus and tf-idf data from backend and render
      let allCorpusData = [];
      async function loadCorpus() {
        try {
          const res = await fetch('/corpus_data');
          allCorpusData = await res.json();
          console.log('Loaded corpus data:', allCorpusData);
          populateFieldSelect();
          renderCorpusTable();
        } catch (error) {
          console.error('Error loading corpus data:', error);
          document.getElementById('corpusTable').innerHTML = '<div class="alert alert-danger">Error loading corpus data. Please try refreshing the page.</div>';
        }
      }
      function populateFieldSelect() {
        const select = document.getElementById('fieldSelect');
        select.innerHTML = '';
        
        // Sort the data to ensure Artificial Intelligence appears first
        const sortedData = [...allCorpusData].sort((a, b) => {
          // If 'Artificial Intelligence' is present, it should come first
          if (a.field === 'Artificial Intelligence') return -1;
          if (b.field === 'Artificial Intelligence') return 1;
          return a.field.localeCompare(b.field);
        });
        
        sortedData.forEach((row, index) => {
          const opt = document.createElement('option');
          opt.value = row.field;
          opt.text = row.field;
          opt.selected = index === 0; // Only select the first item (which should be AI)
          select.appendChild(opt);
        });
      }
      function renderCorpusTable() {
        const selected = document.getElementById('fieldSelect').value;
        console.log('Selected field:', selected);
        console.log('Available data:', allCorpusData);
        
        let html = `<table class='table table-bordered table-hover w-100'><thead class="table-light"><tr><th style="width: 20%">Field</th><th style="width: 80%" colspan="2">Top Preprocessed Words (by TF-IDF)</th></tr></thead><tbody>`;
        
        // Find the selected field data
        const filteredData = allCorpusData.filter(row => row.field === selected);
        console.log('Filtered data:', filteredData);
        
        if (filteredData.length === 0) {
          html += `<tr><td colspan="3" class="text-center"><em>No data available for ${selected}</em></td></tr>`;
        } else {
          filteredData.forEach(row => {
            if (!row.preprocessed_words || row.preprocessed_words.length === 0) {
              html += `<tr><td>${row.field}</td><td colspan="2" class="text-center"><em>No data available</em></td></tr>`;
              return;
            }
            
            // Create a table for word-tfidf pairs
            let wordTfidfTable = '<div class="table-responsive" style="max-height: 400px; overflow-y: auto;"><table class="table table-sm table-striped w-100">';
            wordTfidfTable += '<thead class="sticky-top bg-light"><tr><th style="width: 10%">#</th><th style="width: 45%">Word</th><th style="width: 45%">TF-IDF Value</th></tr></thead><tbody>';
            
            // Add rows for each word-tfidf pair
            row.preprocessed_words.forEach((word, index) => {
              const tfidfValue = row.tfidf_values[index] ? row.tfidf_values[index].toFixed(4) : 'N/A';
              wordTfidfTable += `<tr><td>${index + 1}</td><td>${word}</td><td>${tfidfValue}</td></tr>`;
            });
            
            wordTfidfTable += '</tbody></table></div>';
            
            html += `<tr>
                      <td class="align-middle fw-bold">${row.field}</td>
                      <td colspan="2" class="p-0">${wordTfidfTable}</td>
                    </tr>`;
          });
        }
        html += '</tbody></table>';
        document.getElementById('corpusTable').innerHTML = html;
      }
      // Event listeners
      document.getElementById('fieldSelect').addEventListener('change', renderCorpusTable);
      document.getElementById('vectorMethodSelect').addEventListener('change', handleVectorMethodChange);
      
      function handleVectorMethodChange() {
        const selectedMethod = document.getElementById('vectorMethodSelect').value;
        const comparisonDiv = document.getElementById('vectorMethodComparison');
        
        if (selectedMethod !== 'tfidf') {
          comparisonDiv.style.display = 'block';
          updateMethodComparison(selectedMethod);
        } else {
          comparisonDiv.style.display = 'none';
        }
        
        // Update the corpus table based on selected method
        renderCorpusTable();
      }
      
      function updateMethodComparison(method) {
        // Update method details
        const methodDetails = document.getElementById('methodDetails');
        const methodInfo = getMethodInfo(method);
        
        methodDetails.innerHTML = `
          <div class="card border-0 bg-light">
            <div class="card-body">
              <h6 class="text-primary">${methodInfo.name}</h6>
              <p class="small mb-2"><strong>Dimensions:</strong> ${methodInfo.dimensions}</p>
              <p class="small mb-2"><strong>Type:</strong> ${methodInfo.type}</p>
              <p class="small mb-2"><strong>Best for:</strong> ${methodInfo.useCase}</p>
              <p class="small mb-0"><strong>Memory:</strong> ${methodInfo.memory}</p>
            </div>
          </div>
        `;
        
        // Create comparison chart
        createMethodComparisonChart(method);
      }
      
      function getMethodInfo(method) {
        const methodMap = {
          'word2vec': {
            name: 'Word2Vec',
            dimensions: '300',
            type: 'Dense vectors',
            useCase: 'Semantic similarity',
            memory: 'Medium'
          },
          'bagofwords': {
            name: 'Bag of Words',
            dimensions: 'Vocabulary size',
            type: 'Sparse vectors',
            useCase: 'Simple classification',
            memory: 'High (sparse)'
          },
          'count': {
            name: 'Count Vectorizer',
            dimensions: 'Vocabulary size',
            type: 'Count-based',
            useCase: 'Frequency analysis',
            memory: 'High'
          }
        };
        return methodMap[method] || methodMap['tfidf'];
      }
      
      function createMethodComparisonChart(selectedMethod) {
        const ctx = document.getElementById('methodComparisonChart').getContext('2d');
        
        // Destroy existing chart if it exists
        if (window.methodChart) {
          window.methodChart.destroy();
        }
        
        const data = {
          labels: ['TF-IDF', 'Word2Vec', 'Bag of Words', 'Count Vectorizer'],
          datasets: [{
            label: 'Performance Score',
            data: [85, 92, 78, 82],
            backgroundColor: [
              selectedMethod === 'tfidf' ? '#FF6384' : '#36A2EB',
              selectedMethod === 'word2vec' ? '#FF6384' : '#36A2EB',
              selectedMethod === 'bagofwords' ? '#FF6384' : '#36A2EB',
              selectedMethod === 'count' ? '#FF6384' : '#36A2EB'
            ],
            borderColor: '#fff',
            borderWidth: 2
          }]
        };
        
        window.methodChart = new Chart(ctx, {
          type: 'bar',
          data: data,
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              title: {
                display: true,
                text: 'Vectorization Method Comparison'
              },
              legend: {
                display: false
              }
            },
            scales: {
              y: {
                beginAtZero: true,
                max: 100,
                title: {
                  display: true,
                  text: 'Performance Score (%)'
                }
              }
            }
          }
        });
      }
      
      loadCorpus();
    </script>
</body>
</html>
